name: Import native Helena videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-video-assets.yml'

permissions:
  contents: write

jobs:
  import-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download published source videos
        env:
          VIDEO1: "https://media.descriptusercontent.com/v2/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F5b0ffdf6-69a0-4671-a0fd-4de83065c249%2Fhls%3Fexpiration%3D1791758544928%26signature%3Dd7acf29fd16a36c6f74190b2a6ab5e8ae12bc6d701ae18ee030712fd2c08ef37&filename=Apresenta+o+Helena.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1791754945&signature=fb52a2588dca25bb811a9bee458000b150431bf5e8c87bb234c4c1e0eb7fd97e"
          VIDEO2: "https://media.descriptusercontent.com/v2/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2Fb2919c37-a0ef-4124-956e-c0d4d27a57aa%2Fhls%3Fexpiration%3D1791758551414%26signature%3D845c01db17fecb06d11d876c3eb3297cde0ceebac035cbd6dda18aa417998259&filename=Reflex+o+Helena.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1791754951&signature=ad886f61e05c7e6af31b066847950f379eb3ec25524ebdd305711264962565aa"
        run: |
          mkdir -p /tmp/helena assets/videos
          curl --fail --location --retry 3 "$VIDEO1" -o /tmp/helena/source-01.mp4
          curl --fail --location --retry 3 "$VIDEO2" -o /tmp/helena/source-02.mp4
          ls -lh /tmp/helena

      - name: Encode web MP4s and official covers
        run: |
          ffmpeg -y -i /tmp/helena/source-01.mp4 -vf "scale=480:-2" -c:v libx264 -preset medium -crf 27 -c:a aac -b:a 64k -movflags +faststart assets/videos/helena-video-01.mp4
          ffmpeg -y -i /tmp/helena/source-02.mp4 -vf "scale=480:-2" -c:v libx264 -preset medium -crf 27 -c:a aac -b:a 64k -movflags +faststart assets/videos/helena-video-02.mp4
          ffmpeg -y -ss 2 -i assets/videos/helena-video-01.mp4 -frames:v 1 -q:v 2 assets/videos/helena-video-01-cover.jpg
          ffmpeg -y -ss 2 -i assets/videos/helena-video-02.mp4 -frames:v 1 -q:v 2 assets/videos/helena-video-02-cover.jpg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/videos/helena-video-01.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/videos/helena-video-02.mp4
          ls -lh assets/videos

      - name: Commit native video assets and remove temporary workflow
        run: |
          git config user.name "RennanLucas"
          git config user.email "rennanlucas27oficial@gmail.com"
          git add assets/videos
          git rm .github/workflows/import-video-assets.yml
          git commit -m "feat: hospedar vídeos nativos com capas oficiais"
          git push origin main
