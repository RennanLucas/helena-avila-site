<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Preview de refinamento visual — Helena Ávila</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f6f3ef;overflow:hidden}
    #site{width:100%;height:100%;border:0;display:block;background:#faf8f5}
  </style>
</head>
<body>
  <iframe id="site" src="/index.html?design-preview=1" title="Preview refinado do site Helena Ávila"></iframe>
  <script>
    const refinedCSS = `
      :root{
        --ref-shadow-xs:0 1px 2px rgba(30,22,16,.04),0 1px 1px rgba(30,22,16,.025);
        --ref-shadow-sm:0 8px 24px rgba(30,22,16,.055),0 2px 8px rgba(30,22,16,.035);
        --ref-shadow-md:0 18px 48px rgba(30,22,16,.08),0 4px 16px rgba(30,22,16,.045);
        --ref-ring:rgba(142,101,71,.28);
      }

      html{scroll-padding-top:90px}
      body{
        background:linear-gradient(180deg,#fbf9f6 0%,#faf8f5 36%,#f8f5f1 100%);
        text-rendering:optimizeLegibility;
        letter-spacing:-.002em;
      }

      .site-container{max-width:1240px}

      /* Cabeçalho: mesma estrutura, acabamento mais editorial */
      #mainNav{
        background:rgba(250,248,245,.88)!important;
        border-color:rgba(216,209,199,.74)!important;
        box-shadow:0 8px 28px rgba(29,22,16,.045);
        -webkit-backdrop-filter:blur(18px) saturate(140%);
        backdrop-filter:blur(18px) saturate(140%);
      }
      #mainNav nav a{letter-spacing:.07em}
      #mainNav nav a::after{height:1.5px;border-radius:999px}
      #mobileDrawer{
        border-radius:0 0 24px 24px;
        box-shadow:0 22px 50px rgba(24,18,14,.10)!important;
      }

      /* Hero: sem mudar conteúdo ou composição */
      #inicio{
        background-color:#fbf9f6;
        background-image:
          radial-gradient(circle at 82% 18%,rgba(197,160,89,.09),transparent 31%),
          radial-gradient(circle at 12% 72%,rgba(69,99,78,.06),transparent 28%),
          linear-gradient(to right,rgba(0,0,0,.019) 1px,transparent 1px),
          linear-gradient(to bottom,rgba(0,0,0,.019) 1px,transparent 1px)!important;
        background-size:auto,auto,34px 34px,34px 34px!important;
      }
      #inicio h1{
        letter-spacing:-.042em!important;
        text-wrap:balance;
      }
      #inicio p{max-width:66ch}
      #inicio [class*="rounded-full"]{
        box-shadow:var(--ref-shadow-xs);
      }
      #inicio img{
        filter:saturate(.96) contrast(1.015);
      }

      /* Botões: profundidade e resposta tátil mais refinadas */
      a[class*="bg-[#151619]"],button[class*="bg-[#151619]"]{
        box-shadow:0 8px 22px rgba(21,22,25,.14),inset 0 1px 0 rgba(255,255,255,.08)!important;
      }
      a[class*="bg-[#8E6547]"],button[class*="bg-[#8E6547]"]{
        box-shadow:0 8px 22px rgba(142,101,71,.18),inset 0 1px 0 rgba(255,255,255,.12)!important;
      }
      a,button{-webkit-tap-highlight-color:transparent}
      a:focus-visible,button:focus-visible{
        outline:3px solid var(--ref-ring)!important;
        outline-offset:3px!important;
      }

      /* Cards: hierarquia visual mais premium, sem alterar layout */
      .spotlight-card{
        background:rgba(255,255,255,.965)!important;
        border-color:rgba(214,205,194,.88)!important;
        box-shadow:var(--ref-shadow-sm);
      }
      .spotlight-card:hover{
        transform:translateY(-5px)!important;
        box-shadow:var(--ref-shadow-md)!important;
        border-color:rgba(142,101,71,.38)!important;
      }
      .spotlight-card::before{
        width:440px!important;
        height:440px!important;
        background:radial-gradient(circle,rgba(142,101,71,.095),transparent 67%)!important;
      }
      .spotlight-card-dark{
        background:linear-gradient(145deg,rgba(28,29,33,.90),rgba(18,19,22,.88))!important;
        border-color:rgba(255,255,255,.105)!important;
        box-shadow:0 18px 45px rgba(0,0,0,.22);
      }
      .spotlight-card-dark:hover{
        box-shadow:0 24px 60px rgba(0,0,0,.30)!important;
      }

      /* Métricas e elementos informativos */
      .metric-item{
        border-color:rgba(216,209,199,.86)!important;
        box-shadow:var(--ref-shadow-xs);
      }
      .metric-item:hover{
        transform:translateY(-4px)!important;
        box-shadow:var(--ref-shadow-sm);
      }

      /* Consultórios e controles */
      #locTabButtons>div{
        box-shadow:inset 0 1px 2px rgba(42,31,24,.06),0 8px 28px rgba(42,31,24,.04)!important;
      }
      .loc-tab-btn{border-radius:13px!important}
      .loc-tab-btn.active{
        box-shadow:0 8px 22px rgba(142,101,71,.23)!important;
      }
      .loc-view{
        box-shadow:var(--ref-shadow-md)!important;
      }

      /* Seções: ritmo e separação sutil */
      #caminhos,#sobre,#reembolso,#avaliacoes{
        border-color:rgba(216,209,199,.72)!important;
      }
      #metodologia{
        box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(255,255,255,.04);
      }
      #avaliacoes .spotlight-card{
        background:linear-gradient(180deg,#fff 0%,#fdfbf9 100%)!important;
      }

      /* FAQ */
      #faq .spotlight-card{
        border-radius:20px!important;
        transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease!important;
      }
      #faq .spotlight-card:hover{
        transform:translateY(-2px)!important;
        box-shadow:0 12px 30px rgba(30,22,16,.065)!important;
      }

      /* Barra flutuante */
      #bottomStickyBar>div{
        background:rgba(250,248,245,.93)!important;
        border-color:rgba(216,209,199,.86)!important;
        box-shadow:0 18px 55px rgba(28,21,16,.14)!important;
        -webkit-backdrop-filter:blur(20px) saturate(145%);
        backdrop-filter:blur(20px) saturate(145%);
      }

      /* Modal */
      #infoModalContent{
        border-color:rgba(216,209,199,.9)!important;
        box-shadow:0 34px 90px rgba(16,12,9,.22)!important;
      }

      /* Tipografia fina */
      h1,h2,h3,.font-serif{font-kerning:normal}
      h2{letter-spacing:-.027em}
      p{letter-spacing:-.006em}

      /* Mobile: preservar estrutura e melhorar respiro/legibilidade */
      @media(max-width:767px){
        .site-container{padding-left:18px!important;padding-right:18px!important}
        #inicio{padding-top:3.25rem!important;padding-bottom:5.5rem!important}
        #inicio h1{letter-spacing:-.032em!important;line-height:1.08!important}
        #inicio .grid.grid-cols-3{gap:8px!important}
        .metric-item{padding:12px!important;border-radius:16px!important}
        .spotlight-card{border-radius:20px!important}
        #consultorios .spotlight-card{padding:24px!important}
        #bottomStickyBar{left:10px!important;right:10px!important;bottom:10px!important}
        #bottomStickyBar>div{border-radius:20px!important;padding:10px!important}
      }

      @media(min-width:1280px){
        #inicio{padding-top:5.5rem!important;padding-bottom:8.5rem!important}
      }

      @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{
          scroll-behavior:auto!important;
          animation-duration:.01ms!important;
          animation-iteration-count:1!important;
          transition-duration:.01ms!important;
        }
      }
    `;

    const frame = document.getElementById('site');
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const old = doc.getElementById('chatgpt-design-refinements');
        if (old) old.remove();
        const style = doc.createElement('style');
        style.id = 'chatgpt-design-refinements';
        style.textContent = refinedCSS;
        doc.head.appendChild(style);
      } catch (err) {
        console.error('Não foi possível aplicar o preview visual.', err);
      }
    });
  </script>
</body>
</html>
